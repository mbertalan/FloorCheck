[AccessTransformers]
; The conveyor-lift hologram keeps the position of its moving end (mTopTransform) private.
; Making the altimeter subsystem a friend lets it read that value without editing game headers.
Friend=(Class="AFGConveyorLiftHologram", FriendClass="AAltimeterSubsystem")
; Buildable holograms keep what they snapped to (mSnappedFloor, mSnappedWall) and how far they are
; being stacked (mDesiredZoop) out of reach; the foundation readout needs both.
Friend=(Class="AFGBuildableHologram", FriendClass="AAltimeterSubsystem")
